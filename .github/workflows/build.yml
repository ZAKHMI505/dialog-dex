name: Build Dialog DEX
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Compile, verify, package
        run: |
          set -e
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          AJ=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -1)/android.jar
          mkdir -p out dex pkg
          javac -source 8 -target 8 -bootclasspath $AJ -d out $(find src -name '*.java')
          $BT/d8 --release --min-api 32 --lib $AJ --output dex $(find out -name '*.class')
          cp dex/classes.dex pkg/classes2.dex
          cp "HOOK .txt" pkg/
          $BT/dexdump pkg/classes2.dex > dump.txt
          grep -q "Lcom/darkgpt/welcome/WelcomeDialog;" dump.txt
          grep -q "show" dump.txt
          grep -q "(Landroid/app/Activity;)V" dump.txt
          (cd pkg && zip ../DarkGPT_Dialog_HOOK.zip "HOOK .txt" classes2.dex)
          unzip -l DarkGPT_Dialog_HOOK.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest DarkGPT_Dialog_HOOK.zip --title "Dialog ZIP" --notes "Auto build" --target ${{ github.sha }}
